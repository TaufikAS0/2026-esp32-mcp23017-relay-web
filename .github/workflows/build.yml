name: Firmware build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: python -m unittest discover -s tests -v
      - run: node tests/ui.cjs
      - run: python scripts/build.py --cli arduino-cli
      - uses: actions/upload-artifact@v4
        with:
          name: relay-web-firmware
          path: |
            build/*.bin
            build/manifest.json
